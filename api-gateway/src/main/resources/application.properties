spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Service routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/user-follows/**, /api/user-music-effects/**

spring.cloud.gateway.routes[1].id=quiz-service
spring.cloud.gateway.routes[1].uri=lb://quiz-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/quizzes/**, /api/quiz-games/**, /api/quiz-collections/**

spring.cloud.gateway.routes[2].id=question-service
spring.cloud.gateway.routes[2].uri=lb://question-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/questions/**, /api/question-types/**

spring.cloud.gateway.routes[3].id=gameplay-service
spring.cloud.gateway.routes[3].uri=lb://gameplay-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/quiz-game-tracking/**, /api/question-tracking/**, /api/participants/**

# OpenAPI endpoints
spring.cloud.gateway.routes[4].id=openapi
spring.cloud.gateway.routes[4].uri=http://localhost:${server.port}
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs

# Swagger route for user-service
spring.cloud.gateway.routes[5].id=user-service-openapi
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/user-service/v3/api-docs, /v3/api-docs

# Swagger route for quiz-service
spring.cloud.gateway.routes[6].id=quiz-service-openapi
spring.cloud.gateway.routes[6].uri=lb://quiz-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/quiz-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/quiz-service/v3/api-docs, /v3/api-docs

# Swagger route for question-service
spring.cloud.gateway.routes[7].id=question-service-openapi
spring.cloud.gateway.routes[7].uri=lb://question-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/question-service/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/question-service/v3/api-docs, /v3/api-docs

# Swagger route for gameplay-service
spring.cloud.gateway.routes[8].id=gameplay-service-openapi
spring.cloud.gateway.routes[8].uri=lb://gameplay-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/gameplay-service/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/gameplay-service/v3/api-docs, /v3/api-docs

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[1].url=/quiz-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Quiz Service
springdoc.swagger-ui.urls[2].url=/question-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Question Service
springdoc.swagger-ui.urls[3].url=/gameplay-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Gameplay Service

# Enable actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true