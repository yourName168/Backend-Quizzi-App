version: '3.8'

services:
  db:
    image: mysql:8.0.36-debian
    container_name: quiz-app-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: quiz-app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  app:
    image: ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG} 
    container_name: quiz-app
    depends_on:
      - db
    ports:
      - "80:8080"
    environment:
      DBMS_CONNECTION: jdbc:mysql://db:3306/quiz-app
      DBMS_USER: root
      DBMS_PASSWORD: ${DB_PASSWORD}
    restart: always

volumes:
  db_data: