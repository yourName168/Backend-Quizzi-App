name: Build & Deploy Docker to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Build, tag, and push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPO: ${{ secrets.ECR_REPO_NAME }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
        
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to EC2
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPO: ${{ secrets.ECR_REPO_NAME }}
        IMAGE_TAG: latest
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        # Create a temporary .env file to transfer
        cat > .env << EOF
        ECR_REGISTRY=$ECR_REGISTRY
        ECR_REPO=$ECR_REPO
        IMAGE_TAG=$IMAGE_TAG
        AWS_REGION=$AWS_REGION
        AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
        DB_PASSWORD=$DB_PASSWORD
        EOF
        
        # Copy docker-compose.yml and .env to EC2
        scp docker-compose.yml .env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/
        
        # Execute deployment commands on EC2
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          # Install Docker Compose if needed
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Load environment variables
          source .env
          
          # Configure AWS credentials
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOC
          [default]
          aws_access_key_id = $AWS_ACCESS_KEY_ID
          aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          region = $AWS_REGION
          EOC
          
          chmod 600 ~/.aws/credentials
          
          # Login to ECR
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull the latest image
          docker pull $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          
          # Start containers with environment variables
          docker-compose up -d
          
          # Wait for containers to start
          sleep 10
          
          # Check container status
          echo "Container status:"
          docker ps -a
          
          # Check logs for the app container
          echo "Application container logs:"
          docker logs quiz-app 2>&1 || echo "Container not found or not running yet"
        EOF
        
        # Remove the temporary .env file
        rm .env
