<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">Đăng Nhập</button>
        <p id="message" style="color: red;"></p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try{

                const response = await fetch('http://localhost:8080/identity/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },credentials: "include",
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                document.getElementById('message').textContent = result.message || 'Đăng nhập thành công!';
            } catch (error) {
                document.getElementById('message').textContent = 'Đăng nhập thất bại!';
            }
        }
    </script>
</body>
</html>
